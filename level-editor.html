<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Puffin Panic 2 – Level Editor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;
  --text:#c9d1d9;--muted:#8b949e;--accent:#388bfd;--accent2:#1f6feb;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;--orange:#fb8f44;
  --sidebar:280px;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;overflow:hidden}
/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{display:flex;align-items:center;gap:6px;padding:5px 10px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);
  border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
#canvas-wrap{flex:1;overflow:auto;background:#08080f;padding:12px;display:flex;align-items:flex-start;justify-content:flex-start}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;display:block;
  flex-shrink:0;border:1px solid #1c2035}
#statusbar{display:flex;align-items:center;gap:14px;padding:3px 10px;
  background:var(--bg2);border-top:1px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0}
/* ── Controls ── */
select,input[type=number],input[type=text]{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:3px 7px;font-size:12px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
select{cursor:pointer}
button{background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--border)}
button.primary{background:var(--accent2);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent)}
button.success{background:#1a4731;border-color:var(--green);color:#fff}
button.success:hover{background:#196332}
button.active{background:var(--accent2);border-color:var(--accent)}
button.icon{padding:4px 8px;min-width:28px;font-size:13px}
/* ── Top bar specific ── */
#topbar h1{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}
#topbar h1 em{color:var(--accent);font-style:normal}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
/* ── Sidebar sections ── */
.sec{border-bottom:1px solid var(--border);padding:8px 10px}
.sec-title{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);margin-bottom:7px}
.field{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.field label{font-size:11px;color:var(--muted);width:88px;flex-shrink:0}
.field input,.field select{flex:1;min-width:0}
.field input[type=number]{width:56px;flex:none}
/* ── Tool grid ── */
#tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:7px}
.tbtn{padding:5px 2px;font-size:15px;text-align:center;border-radius:5px;line-height:1.1}
.tbtn small{display:block;font-size:9px;color:var(--muted);margin-top:1px}
#brush-row{display:flex;gap:3px}
.bbtn{width:32px;height:26px;font-size:11px;padding:0;text-align:center}
/* ── Skills ── */
#skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.sk{display:flex;align-items:center;gap:4px}
.sk label{font-size:11px;color:var(--muted);flex:1}
.sk input{width:42px;text-align:center}
/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabbt{padding:6px 11px;font-size:11px;background:none;border:none;
  border-bottom:2px solid transparent;border-radius:0;color:var(--muted);cursor:pointer}
.tabbt.active{color:var(--accent);border-bottom-color:var(--accent)}
.pane{display:none}.pane.active{display:block}
/* ── Status dot ── */
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px}
/* ── Zones ── */
.zone-row{display:flex;gap:3px;align-items:center;margin-bottom:4px;font-size:11px}
.zone-row span{color:var(--muted);width:14px}
.zone-row input{width:40px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#dirty{display:none;color:var(--yellow);font-size:11px}
</style>
</head>
<body>
<div id="app">

<!-- ── Top bar ── -->
<div id="topbar">
  <h1>🐧 <em>Puffin Panic 2</em> – Level Editor</h1>
  <div class="tb-sep"></div>
  <button class="icon" id="btn-prev" title="Previous level (,)">◀</button>
  <select id="lvl-sel" style="width:210px"></select>
  <button class="icon" id="btn-next" title="Next level (.)">▶</button>
  <div class="tb-sep"></div>
  <button class="icon" id="btn-undo" title="Undo (Ctrl+Z)">↩</button>
  <button class="icon" id="btn-redo" title="Redo (Ctrl+Y)">↪</button>
  <div class="tb-sep"></div>
  <select id="zoom-sel" style="width:60px" title="Zoom">
    <option value="1">1×</option>
    <option value="2" selected>2×</option>
    <option value="3">3×</option>
    <option value="4">4×</option>
  </select>
  <label style="font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer">
    <input type="checkbox" id="grid-chk"> Grid
  </label>
  <div class="tb-sep"></div>
  <button class="success" id="btn-save">💾 Save</button>
  <button id="btn-dl">⬇ Download</button>
  <span id="dirty">● Unsaved changes</span>
</div>

<!-- ── Main ── -->
<div id="main">

  <!-- Sidebar -->
  <div id="sidebar">
    <!-- Tools -->
    <div class="sec">
      <div class="sec-title">Tools <span style="color:var(--muted);font-weight:400">(keyboard shortcuts)</span></div>
      <div id="tool-grid">
        <button class="tbtn active" data-tool="solid"    title="S — Solid terrain">🪨<small>Solid</small></button>
        <button class="tbtn"        data-tool="erase"    title="E — Erase">🧹<small>Erase</small></button>
        <button class="tbtn"        data-tool="rect"     title="R — Rectangle">▭<small>Rect</small></button>
        <button class="tbtn"        data-tool="fill"     title="F — Flood fill">🪣<small>Fill</small></button>
        <button class="tbtn"        data-tool="steel"    title="T — Steel (indestructible)">🔩<small>Steel</small></button>
        <button class="tbtn"        data-tool="oneway-r" title="&gt; — One-way right">→<small>1-Way→</small></button>
        <button class="tbtn"        data-tool="oneway-l" title="&lt; — One-way left">←<small>1-Way←</small></button>
        <button class="tbtn"        data-tool="entrance" title="N — Move entrance">🚪<small>Entrance</small></button>
        <button class="tbtn"        data-tool="exit"     title="X — Move exit">🏁<small>Exit</small></button>
      </div>
      <div class="sec-title" style="margin-top:6px">Brush</div>
      <div id="brush-row">
        <button class="bbtn active" data-sz="1">1</button>
        <button class="bbtn" data-sz="2">2</button>
        <button class="bbtn" data-sz="4">4</button>
        <button class="bbtn" data-sz="8">8</button>
        <button class="bbtn" data-sz="16">16</button>
        <button class="bbtn" data-sz="32">32</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tabbt active" data-tab="settings">Settings</button>
      <button class="tabbt" data-tab="skills">Skills</button>
      <button class="tabbt" data-tab="zones">Zones</button>
    </div>

    <!-- Settings -->
    <div class="pane active sec" id="tab-settings">
      <div class="field"><label>Name</label><input type="text" id="s-name" style="flex:1"></div>
      <div class="field"><label>Theme</label>
        <select id="s-theme" style="flex:1">
          <option>grass</option><option>desert</option><option>snow</option><option>rock</option>
          <option>ice</option><option>lava</option><option>crystal</option><option>water</option>
          <option>mud</option><option>cave</option><option>mossy</option>
          <option>cliff_chalk</option><option>slate_ledge</option><option>frozen_mud</option>
          <option>packed_snow</option><option>black_ice</option><option>volcanic_ash</option>
          <option>obsidian_floor</option><option>salt_flats</option><option>wet_cave_stone</option>
          <option>rusty_metal</option><option>wood_planks</option><option>mossy_ruin</option>
          <option>crystal_dense</option><option>fungus_glow</option><option>toxic_sludge</option>
          <option>sandstone</option><option>deep_sea</option><option>iron_ore</option>
          <option>coral</option><option>amber</option><option>bone_white</option>
        </select>
      </div>
      <div class="field"><label>Total puffins</label><input type="number" id="s-total" min="1" max="99"></div>
      <div class="field"><label>Required</label><input type="number" id="s-req" min="1" max="99"></div>
      <div class="field"><label>Spawn rate</label><input type="number" id="s-spawn" min="1" max="240"><span style="font-size:11px;color:var(--muted)">ticks</span></div>
      <div class="field"><label>Time (sec)</label><input type="number" id="s-time" min="30" max="9999"></div>
      <div class="sec-title" style="margin-top:8px">Entrance</div>
      <div class="field">
        <label>X</label><input type="number" id="s-ex" min="0" max="399">
        <label style="width:auto">Y</label><input type="number" id="s-ey" min="0" max="219">
      </div>
      <div class="sec-title" style="margin-top:4px">Exit</div>
      <div class="field">
        <label>X</label><input type="number" id="s-xx" min="0" max="399">
        <label style="width:auto">Y</label><input type="number" id="s-xy" min="0" max="219">
      </div>
      <div class="field">
        <label>W</label><input type="number" id="s-xw" min="4" max="80">
        <label style="width:auto">H</label><input type="number" id="s-xh" min="4" max="60">
      </div>
    </div>

    <!-- Skills -->
    <div class="pane sec" id="tab-skills">
      <div id="skills-grid"></div>
    </div>

    <!-- Zones -->
    <div class="pane sec" id="tab-zones">
      <div class="sec-title">Water Zones</div>
      <div id="water-list"></div>
      <button id="btn-add-water" style="width:100%;margin-top:4px">+ Add Water Zone</button>
      <div class="sec-title" style="margin-top:10px">Lava Zones</div>
      <div id="lava-list"></div>
      <button id="btn-add-lava" style="width:100%;margin-top:4px">+ Add Lava Zone</button>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
  </div>
</div>

<!-- Status bar -->
<div id="statusbar">
  <span><span class="dot" id="sdot"></span><span id="smsg">Connecting…</span></span>
  <span id="scoord" style="font-family:monospace">x:— y:—</span>
  <span id="scell">cell:—</span>
  <span id="slvl"></span>
</div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────
const W = 400, H = 220;
const API = 'http://localhost:3747';

const THEME_SOLID = {
  grass:'#4a7c59',desert:'#b87c4a',snow:'#8db8cc',rock:'#6b7280',
  ice:'#7ab8d0',lava:'#b84820',crystal:'#7c5cf0',water:'#2d6fa8',
  mud:'#6b5c3e',cave:'#4a4458',mossy:'#4a7c59',cliff_chalk:'#c8bfa0',
  slate_ledge:'#5a6878',frozen_mud:'#7a8a8c',packed_snow:'#8dbac8',
  black_ice:'#4a7888',volcanic_ash:'#585250',obsidian_floor:'#2a2030',
  salt_flats:'#c0b898',wet_cave_stone:'#4a5a60',rusty_metal:'#885040',
  wood_planks:'#987858',mossy_ruin:'#507860',crystal_dense:'#6050c0',
  fungus_glow:'#48a060',toxic_sludge:'#608840',sandstone:'#c09060',
  deep_sea:'#1a3860',iron_ore:'#585868',coral:'#d07868',amber:'#c89040',
  bone_white:'#c8c4b0',
};

const SKILLS = [
  {id:'climber',  lb:'Climber 🧗'},
  {id:'floater',  lb:'Floater ☂️'},
  {id:'bomber',   lb:'Bomber 💣'},
  {id:'blocker',  lb:'Blocker 🛑'},
  {id:'builder',  lb:'Builder 🧱'},
  {id:'basher',   lb:'Basher 🥊'},
  {id:'miner',    lb:'Miner ⚒️'},
  {id:'digger',   lb:'Digger ⛏️'},
  {id:'platformer',lb:'Platformer 🏗'},
];

// ─── State ─────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let imgData  = null; // ImageData (W × H)

let terrain  = new Uint8Array(W * H);
let level    = null;   // parsed JSON
let levelN   = 1;
let dirty    = false;
let tool     = 'solid';
let brushSz  = 1;
let zoom     = 2;
let showGrid = false;
let drawing  = false;
let rectSt   = null;
let undoQ    = [], redoQ = [];

// ─── Terrain helpers ───────────────────────────────────────────
const get = (x, y) => (x<0||x>=W||y<0||y>=H) ? 0 : terrain[y*W+x];
function set(x, y, v) { if(x>=0&&x<W&&y>=0&&y<H) terrain[y*W+x]=v; }

function paintBrush(x, y, v) {
  const h = Math.floor(brushSz/2);
  for (let dy=-h; dy<brushSz-h; dy++)
    for (let dx=-h; dx<brushSz-h; dx++) set(x+dx, y+dy, v);
}

function toolVal() {
  if (tool==='solid')    return 1;
  if (tool==='steel')    return 10;
  if (tool==='oneway-r') return 11;
  if (tool==='oneway-l') return 12;
  if (tool==='erase')    return 0;
  if (tool==='rect')     return 1;
  if (tool==='fill')     return 1;
  return 1;
}

function floodFill(sx, sy, fv) {
  const orig = get(sx, sy);
  if (orig === fv) return;
  const stk = [[sx, sy]];
  const vis = new Uint8Array(W*H);
  while (stk.length) {
    const [x,y] = stk.pop();
    if (x<0||x>=W||y<0||y>=H||vis[y*W+x]) continue;
    if (get(x,y) !== orig) continue;
    vis[y*W+x] = 1;
    set(x, y, fv);
    stk.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
}

// ─── RLE encode/decode ─────────────────────────────────────────
function decodeRLE(pairs) {
  const out = new Uint8Array(W*H);
  let i = 0;
  for (const p of pairs) {
    const v = Number(p[0])||0, c = Number(p[1])||0;
    for (let j=0; j<c && i<out.length; j++) out[i++]=v;
  }
  return out;
}

function encodeRLE(data) {
  const pairs = [];
  let i = 0;
  while (i < data.length) {
    const v = data[i]; let c = 1;
    while (i+c < data.length && data[i+c]===v && c<65535) c++;
    pairs.push([v, c]);
    i += c;
  }
  return pairs;
}

// ─── Render ────────────────────────────────────────────────────
function hexToRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

function render(rectPrev=null) {
  if (!imgData) imgData = ctx.createImageData(W, H);
  const d = imgData.data;
  const theme = level?.theme || 'grass';
  const sc = hexToRgb(THEME_SOLID[theme]||'#6b8fa8');

  for (let y=0; y<H; y++) {
    for (let x=0; x<W; x++) {
      let cell = terrain[y*W+x];
      if (rectPrev && x>=rectPrev.x1&&x<=rectPrev.x2&&y>=rectPrev.y1&&y<=rectPrev.y2)
        cell = rectPrev.v;

      let r,g,b;
      if      (cell===0)  { r=8;  g=8;  b=15; }
      else if (cell===1)  { [r,g,b]=sc; }
      else if (cell===10) { r=148;g=155;b=163; }  // steel — silver
      else if (cell===11) { r=212;g=165;b=32; }   // one-way right — amber
      else if (cell===12) { r=192;g=128;b=16; }   // one-way left — dark amber
      else                { [r,g,b]=sc; }

      const pi = (y*W+x)*4;
      d[pi]=r; d[pi+1]=g; d[pi+2]=b; d[pi+3]=255;
    }
  }

  // Scale up: CSS zoom already handles visual scaling; putImageData at 1×1
  ctx.putImageData(imgData, 0, 0);
  drawOverlays(rectPrev);
}

function drawOverlays(rectPrev) {
  if (!level) return;

  const z = 1; // canvas is at W×H; CSS zoom scales it up
  ctx.save();
  ctx.globalAlpha = 1;

  // Grid
  if (showGrid) {
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 0.5;
    for (let x=0; x<=W; x+=8) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y=0; y<=H; y+=8) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  }

  // One-way arrows (tiny)
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.font = '4px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let y=0; y<H; y++) for (let x=0; x<W; x++) {
    const v = terrain[y*W+x];
    if (v===11||v===12) ctx.fillText(v===11?'›':'‹', x+0.5, y+0.5);
  }

  // Water zones
  if (level.waterZones) {
    ctx.fillStyle   = 'rgba(45,111,168,0.28)';
    ctx.strokeStyle = 'rgba(100,180,255,0.7)';
    ctx.lineWidth   = 0.5;
    for (const z of level.waterZones) {
      ctx.fillRect(z.x,z.y,z.w,z.h);
      ctx.strokeRect(z.x,z.y,z.w,z.h);
    }
  }

  // Lava zones
  if (level.lavaZones) {
    ctx.fillStyle   = 'rgba(184,72,32,0.28)';
    ctx.strokeStyle = 'rgba(255,100,0,0.7)';
    ctx.lineWidth   = 0.5;
    for (const z of level.lavaZones) {
      ctx.fillRect(z.x,z.y,z.w,z.h);
      ctx.strokeRect(z.x,z.y,z.w,z.h);
    }
  }

  // Entrance — green diamond
  const ent = level.entrance;
  ctx.fillStyle   = 'rgba(63,185,80,0.92)';
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth   = 0.5;
  ctx.beginPath();
  ctx.moveTo(ent.x,     ent.y-5);
  ctx.lineTo(ent.x+4,   ent.y);
  ctx.lineTo(ent.x,     ent.y+5);
  ctx.lineTo(ent.x-4,   ent.y);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 3px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('IN', ent.x, ent.y+0.5);

  // Exit — blue rect
  const ex = level.exit;
  ctx.fillStyle   = 'rgba(56,139,253,0.28)';
  ctx.strokeStyle = '#388bfd';
  ctx.lineWidth   = 0.75;
  ctx.fillRect(ex.x, ex.y, ex.w, ex.h);
  ctx.strokeRect(ex.x, ex.y, ex.w, ex.h);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 4px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('EXIT', ex.x+ex.w/2, ex.y+ex.h/2);

  ctx.restore();
}

function applyZoom() {
  canvas.width  = W;
  canvas.height = H;
  canvas.style.width  = `${W*zoom}px`;
  canvas.style.height = `${H*zoom}px`;
  imgData = null;
  render();
}

// ─── Undo / Redo ───────────────────────────────────────────────
function saveUndo() {
  undoQ.push(new Uint8Array(terrain));
  if (undoQ.length > 60) undoQ.shift();
  redoQ = [];
}
function undo() {
  if (!undoQ.length) return;
  redoQ.push(new Uint8Array(terrain)); terrain.set(undoQ.pop()); markDirty(); render();
}
function redo() {
  if (!redoQ.length) return;
  undoQ.push(new Uint8Array(terrain)); terrain.set(redoQ.pop()); markDirty(); render();
}

// ─── Mouse / pointer events ────────────────────────────────────
function cellAt(e) {
  const r = canvas.getBoundingClientRect();
  return { x: Math.floor((e.clientX-r.left)/zoom), y: Math.floor((e.clientY-r.top)/zoom) };
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousedown', e => {
  const {x,y} = cellAt(e);
  const right = e.button === 2;

  if (tool==='entrance') {
    level.entrance.x=x; level.entrance.y=y;
    syncFormFromLevel(); markDirty(); render(); return;
  }
  if (tool==='exit') {
    level.exit.x=x; level.exit.y=y;
    syncFormFromLevel(); markDirty(); render(); return;
  }
  if (tool==='fill') {
    saveUndo(); floodFill(x,y, right?0:toolVal()); markDirty(); render(); return;
  }
  if (tool==='rect') { rectSt={x,y}; drawing=true; return; }

  saveUndo();
  drawing = true;
  paintBrush(x, y, right ? 0 : toolVal());
  markDirty(); render();
});

canvas.addEventListener('mousemove', e => {
  const {x,y} = cellAt(e);
  document.getElementById('scoord').textContent = `x:${x} y:${y}`;
  document.getElementById('scell').textContent  = `cell:${get(x,y)}`;

  if (!drawing) return;
  if (tool==='rect' && rectSt) {
    const x1=Math.min(rectSt.x,x), x2=Math.max(rectSt.x,x);
    const y1=Math.min(rectSt.y,y), y2=Math.max(rectSt.y,y);
    render({x1,y1,x2,y2,v:toolVal()}); return;
  }
  if (['solid','steel','erase','oneway-r','oneway-l'].includes(tool)) {
    paintBrush(x, y, e.buttons===2 ? 0 : toolVal());
    markDirty(); render();
  }
});

canvas.addEventListener('mouseup', e => {
  const {x,y} = cellAt(e);
  if (tool==='rect' && rectSt) {
    const x1=Math.min(rectSt.x,x), x2=Math.max(rectSt.x,x);
    const y1=Math.min(rectSt.y,y), y2=Math.max(rectSt.y,y);
    saveUndo();
    const v = e.button===2 ? 0 : toolVal();
    for (let ry=y1;ry<=y2;ry++) for (let rx=x1;rx<=x2;rx++) set(rx,ry,v);
    markDirty();
  }
  rectSt=null; drawing=false; render();
});

canvas.addEventListener('mouseleave', () => { drawing=false; render(); });

// Ctrl+Wheel zoom
canvas.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const zs = [1,2,3,4];
  const i = zs.indexOf(zoom);
  zoom = zs[e.deltaY<0 ? Math.min(i+1,3) : Math.max(i-1,0)];
  document.getElementById('zoom-sel').value = zoom;
  applyZoom();
}, {passive:false});

// ─── Load / Save ───────────────────────────────────────────────
async function loadLevel(n) {
  if (dirty && !confirm(`Level ${levelN} has unsaved changes. Discard them?`)) return;
  try {
    setStatus('load', `Loading level ${n}…`);
    const r = await fetch(`${API}/api/level/${n}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    levelN       = n;
    level        = data;
    terrain      = decodeRLE(data.terrain);
    undoQ=[]; redoQ=[];
    dirty = false;
    document.getElementById('dirty').style.display = 'none';
    syncFormFromLevel();
    syncSkillsFromLevel();
    syncZones();
    updateLvlSel();
    imgData = null;
    render();
    setStatus('ok', `Loaded: ${data.name}`);
    document.getElementById('slvl').textContent = `Level ${n} / 99`;
  } catch(err) {
    setStatus('err', 'Load failed: ' + err.message);
    if (err.message.includes('fetch')||err.message.includes('Failed to fetch'))
      setStatus('err', '⚠ Server not running — run: node scripts/level-editor-server.mjs');
  }
}

async function saveToDisk() {
  flushFormToLevel();
  try {
    setStatus('load', 'Saving…');
    const r = await fetch(`${API}/api/level/${levelN}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: serializeLevel(),
    });
    const res = await r.json();
    if (!res.ok) throw new Error(res.error);
    dirty = false;
    document.getElementById('dirty').style.display = 'none';
    setStatus('ok', `Saved level_${String(levelN).padStart(3,'0')}.json`);
  } catch(err) { setStatus('err', 'Save failed: '+err.message); }
}

function downloadJSON() {
  flushFormToLevel();
  const blob = new Blob([serializeLevel()], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: `level_${String(levelN).padStart(3,'0')}.json`,
  });
  a.click();
}

// ─── Serialization ─────────────────────────────────────────────
function serializeLevel() {
  const clone = {...level, terrain: encodeRLE(terrain)};
  const terrain_ = clone.terrain;
  delete clone.terrain;
  const lines = terrain_.map(p => `    [${p[0]},${p[1]}]`).join(',\n');
  return JSON.stringify(clone, null, 2).slice(0,-1)
    + `,\n  "terrain": [\n${lines}\n  ]\n}`;
}

// ─── Form sync ─────────────────────────────────────────────────
function syncFormFromLevel() {
  if (!level) return;
  $('s-name').value  = level.name || '';
  $('s-theme').value = level.theme || 'grass';
  $('s-total').value = level.total || 20;
  $('s-req').value   = level.required || 15;
  $('s-spawn').value = level.spawnRate || 60;
  $('s-time').value  = Math.round((level.time||9600)/30);
  $('s-ex').value    = level.entrance?.x ?? 30;
  $('s-ey').value    = level.entrance?.y ?? 40;
  $('s-xx').value    = level.exit?.x ?? 340;
  $('s-xy').value    = level.exit?.y ?? 150;
  $('s-xw').value    = level.exit?.w ?? 20;
  $('s-xh').value    = level.exit?.h ?? 12;
}

function syncSkillsFromLevel() {
  for (const sk of SKILLS) {
    const el = document.getElementById('sk-'+sk.id);
    if (el) el.value = level?.skills?.[sk.id] ?? 0;
  }
}

function syncZones() {
  renderZoneList('water'); renderZoneList('lava');
}

function renderZoneList(type) {
  const zones = level?.[`${type}Zones`] || [];
  const cont  = document.getElementById(`${type}-list`);
  cont.innerHTML = '';
  zones.forEach((z, i) => {
    const row = document.createElement('div');
    row.className = 'zone-row';
    row.innerHTML = `<span>${i+1}</span>
      x<input type="number" value="${z.x}" min="0" max="399" data-t="${type}" data-i="${i}" data-f="x">
      y<input type="number" value="${z.y}" min="0" max="219" data-t="${type}" data-i="${i}" data-f="y">
      w<input type="number" value="${z.w}" min="1" max="400" data-t="${type}" data-i="${i}" data-f="w">
      h<input type="number" value="${z.h}" min="1" max="220" data-t="${type}" data-i="${i}" data-f="h">
      <button data-del-t="${type}" data-del-i="${i}" style="color:var(--red);padding:2px 5px">✕</button>`;
    cont.appendChild(row);
  });
  cont.querySelectorAll('input[data-t]').forEach(el => el.addEventListener('change', () => {
    const t=el.dataset.t, idx=+el.dataset.i, f=el.dataset.f;
    if (!level[t+'Zones']) level[t+'Zones']=[];
    level[t+'Zones'][idx][f] = +el.value||0;
    markDirty(); render();
  }));
  cont.querySelectorAll('[data-del-t]').forEach(btn => btn.addEventListener('click', () => {
    const t=btn.dataset.delT, idx=+btn.dataset.delI;
    level[t+'Zones'].splice(idx,1);
    if (!level[t+'Zones'].length) delete level[t+'Zones'];
    syncZones(); markDirty(); render();
  }));
}

function flushFormToLevel() {
  if (!level) return;
  level.terrain   = encodeRLE(terrain);
  level.name      = $('s-name').value;
  level.theme     = $('s-theme').value;
  level.total     = +$('s-total').value||20;
  level.required  = +$('s-req').value||15;
  level.spawnRate = +$('s-spawn').value||60;
  level.time      = Math.round(+$('s-time').value * 30);
  level.entrance  = { x:+$('s-ex').value, y:+$('s-ey').value };
  level.exit      = { x:+$('s-xx').value, y:+$('s-xy').value, w:+$('s-xw').value, h:+$('s-xh').value };
  for (const sk of SKILLS) {
    const el = document.getElementById('sk-'+sk.id);
    if (el) { if (!level.skills) level.skills={}; level.skills[sk.id]=+el.value||0; }
  }
}

function liveSync() {
  // Apply relevant settings fields to level object and re-render overlays immediately
  if (!level) return;
  level.entrance = { x:+$('s-ex').value, y:+$('s-ey').value };
  level.exit     = { x:+$('s-xx').value, y:+$('s-xy').value, w:+$('s-xw').value, h:+$('s-xh').value };
  level.theme    = $('s-theme').value;
  markDirty();
  render();
}

// ─── Levels list ───────────────────────────────────────────────
async function loadLevelList() {
  try {
    const r   = await fetch(`${API}/api/levels`);
    const all = await r.json();
    const sel = document.getElementById('lvl-sel');
    sel.innerHTML = '';
    for (const {n, name} of all) {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = `${String(n).padStart(3,'0')}: ${name}`;
      sel.appendChild(o);
    }
    return true;
  } catch { return false; }
}

function updateLvlSel() {
  document.getElementById('lvl-sel').value = levelN;
}

// ─── UI helpers ────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function setStatus(type, msg) {
  const dot = $('sdot');
  dot.style.background = type==='err'?'#f85149':type==='load'?'#d29922':'#3fb950';
  $('smsg').textContent = msg;
}

function markDirty() {
  dirty = true;
  $('dirty').style.display = '';
}

function buildSkillsUI() {
  const g = $('skills-grid');
  for (const sk of SKILLS) {
    const d = document.createElement('div');
    d.className = 'sk';
    d.innerHTML = `<label title="${sk.id}">${sk.lb}</label>
      <input type="number" id="sk-${sk.id}" min="0" max="99" value="0">`;
    g.appendChild(d);
    d.querySelector('input').addEventListener('input', markDirty);
  }
}

// ─── Wire UI ───────────────────────────────────────────────────
function wire() {
  // Level selector
  $('lvl-sel').addEventListener('change', e => loadLevel(+e.target.value));
  $('btn-prev').addEventListener('click', () => { if(levelN>1)  loadLevel(levelN-1); });
  $('btn-next').addEventListener('click', () => { if(levelN<99) loadLevel(levelN+1); });

  // Tools
  document.querySelectorAll('.tbtn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tbtn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    tool = b.dataset.tool;
  }));

  // Brush
  document.querySelectorAll('.bbtn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.bbtn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    brushSz = +b.dataset.sz;
  }));

  // Tabs
  document.querySelectorAll('.tabbt').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabbt').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    b.classList.add('active');
    $('tab-'+b.dataset.tab).classList.add('active');
  }));

  // Zoom
  $('zoom-sel').addEventListener('change', e => { zoom=+e.target.value; applyZoom(); });

  // Grid
  $('grid-chk').addEventListener('change', e => { showGrid=e.target.checked; render(); });

  // Save / Download
  $('btn-save').addEventListener('click', saveToDisk);
  $('btn-dl').addEventListener('click', downloadJSON);

  // Undo / Redo
  $('btn-undo').addEventListener('click', undo);
  $('btn-redo').addEventListener('click', redo);

  // Settings live sync
  ['s-ex','s-ey','s-xx','s-xy','s-xw','s-xh','s-theme'].forEach(id =>
    $(id).addEventListener('change', liveSync));
  document.querySelectorAll('#tab-settings input, #tab-settings select').forEach(el =>
    el.addEventListener('input', markDirty));

  // Zones
  $('btn-add-water').addEventListener('click', () => {
    if (!level.waterZones) level.waterZones = [];
    level.waterZones.push({x:80,y:180,w:100,h:20});
    syncZones(); markDirty(); render();
  });
  $('btn-add-lava').addEventListener('click', () => {
    if (!level.lavaZones) level.lavaZones = [];
    level.lavaZones.push({x:200,y:160,w:80,h:20});
    syncZones(); markDirty(); render();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    const inInput = ['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName);
    if (e.ctrlKey && e.key==='z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey && (e.key==='y'||e.key==='Z')) { e.preventDefault(); redo(); return; }
    if (e.ctrlKey && e.key==='s') { e.preventDefault(); saveToDisk(); return; }
    if (inInput) return;
    const map = {s:'solid',e:'erase',t:'steel',f:'fill',r:'rect',n:'entrance',x:'exit',
                 '>':'oneway-r','<':'oneway-l','.':'next',',':'prev'};
    const action = map[e.key];
    if (!action) return;
    if (action==='next') { if(levelN<99) loadLevel(levelN+1); return; }
    if (action==='prev') { if(levelN>1)  loadLevel(levelN-1); return; }
    document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('active', b.dataset.tool===action));
    tool = action;
  });

  // Warn before closing with unsaved changes
  window.addEventListener('beforeunload', e => {
    if (dirty) { e.preventDefault(); e.returnValue=''; }
  });
}

// ─── Init ──────────────────────────────────────────────────────
async function init() {
  buildSkillsUI();
  wire();
  canvas.width  = W;
  canvas.height = H;
  applyZoom();
  render();
  setStatus('load', 'Connecting to server…');
  const ok = await loadLevelList();
  if (!ok) {
    setStatus('err', '⚠ Server not running — open a terminal and run: node scripts/level-editor-server.mjs');
    return;
  }
  await loadLevel(1);
}

init();
</script>
