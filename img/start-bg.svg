<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880">
  <defs>
    <!-- Background Gradient (Vibrant Sunset/Aurora) -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="30%" stop-color="#302b63" />
      <stop offset="70%" stop-color="#24C6DC" />
      <stop offset="100%" stop-color="#514A9D" />
    </linearGradient>

    <!-- Aurora effect -->
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0" />
      <stop offset="50%" stop-color="#60EFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF0080" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF8C00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0" />
    </linearGradient>

    <!-- Ice Gradient -->
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <linearGradient id="iceDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <!-- Puffin Beak Gradients -->
    <linearGradient id="beakTip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="beakBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="puffin">
      <!-- Orange Feet -->
      <path d="M-15,40 L-25,50 L-10,50 Z" fill="#F97316" />
      <path d="M5,40 L-5,50 L10,50 Z" fill="#F97316" />
      
      <!-- Body (Black) -->
      <path d="M-20,0 C-35,20 -20,50 0,50 C20,50 25,25 15,0 C10,-20 -10,-20 -20,0 Z" fill="#0F172A" />
      
      <!-- Belly (White) -->
      <path d="M-10,10 C-15,30 -5,45 5,45 C15,45 15,30 10,10 C5,-5 -5,-5 -10,10 Z" fill="#FFFFFF" />
      
      <!-- Head -->
      <circle cx="0" cy="-20" r="18" fill="#0F172A" />
      
      <!-- Face (White) -->
      <path d="M-5,-35 C10,-40 18,-25 15,-10 C12,0 -5,5 -10,-10 C-12,-25 -10,-30 -5,-35 Z" fill="#FFFFFF" />
      
      <!-- Beak Base (Grey) -->
      <path d="M12,-28 L20,-28 L18,-12 L10,-16 Z" fill="url(#beakBase)" />
      
      <!-- Beak Tip (Orange) -->
      <path d="M20,-28 C30,-28 35,-20 35,-12 C30,-12 25,-10 18,-12 Z" fill="url(#beakTip)" />
      
      <!-- Yellow Ridge -->
      <path d="M18,-28 L22,-28 L20,-12 L16,-14 Z" fill="#FDE047" />
      
      <!-- Eye Markings -->
      <path d="M2,-25 L10,-20 L2,-22 Z" fill="#0F172A" />
      
      <!-- Eye -->
      <circle cx="5" cy="-22" r="2" fill="#0F172A" />
    </g>

    <g id="puffin-flying">
      <!-- Feet -->
      <path d="M-25,10 L-40,15 L-35,5 Z" fill="#F97316" />
      <path d="M-20,15 L-35,20 L-30,10 Z" fill="#F97316" />
      
      <!-- Body -->
      <path d="M-30,0 C-20,-10 10,-15 20,-5 C30,5 20,15 0,15 C-20,15 -35,10 -30,0 Z" fill="#0F172A" />
      
      <!-- Belly -->
      <path d="M-10,2 C0,-5 15,-5 20,0 C15,10 -5,12 -10,2 Z" fill="#FFFFFF" />
      
      <!-- Far Wing -->
      <path d="M-5,-10 C-10,-30 10,-40 20,-20 C10,-20 5,-15 -5,-10 Z" fill="#1E293B" />
      
      <!-- Head -->
      <circle cx="20" cy="-5" r="14" fill="#0F172A" />
      
      <!-- Face -->
      <path d="M10,-15 C20,-20 30,-10 25,0 C20,10 5,5 0,-5 C-2,-10 5,-12 10,-15 Z" fill="#FFFFFF" />
      
      <!-- Beak Base -->
      <path d="M22,-8 L30,-8 L28,5 L20,2 Z" fill="url(#beakBase)" />
      
      <!-- Beak Tip -->
      <path d="M30,-8 C40,-8 45,0 45,5 C40,5 35,6 28,5 Z" fill="url(#beakTip)" />
      
      <!-- Yellow Ridge -->
      <path d="M28,-8 L32,-8 L30,5 L26,3 Z" fill="#FDE047" />
      
      <!-- Eye Markings & Eye -->
      <path d="M12,-8 L20,-3 L12,-5 Z" fill="#0F172A" />
      <circle cx="15" cy="-5" r="2" fill="#0F172A" />
      
      <!-- Near Wing -->
      <path d="M0,5 C-10,25 10,40 25,15 C15,15 10,10 0,5 Z" fill="#0F172A" />
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="880" fill="url(#sky)" />

  <!-- Stars -->
  <g fill="#FFF" opacity="0.8">
    <circle cx="200" cy="150" r="2" />
    <circle cx="350" cy="80" r="1.5" />
    <circle cx="600" cy="200" r="2.5" />
    <circle cx="850" cy="120" r="1" />
    <circle cx="1100" cy="180" r="2" />
    <circle cx="1350" cy="90" r="3" />
    <circle cx="1500" cy="220" r="1.5" />
    <circle cx="100" cy="300" r="1" />
    <circle cx="450" cy="250" r="2" />
    <circle cx="750" cy="50" r="2" />
    <circle cx="950" cy="280" r="1.5" />
    <circle cx="1250" cy="150" r="2" />
  </g>

  <!-- Aurora -->
  <path d="M-200,400 Q400,100 800,400 T1800,200 L1800,0 L-200,0 Z" fill="url(#aurora1)" filter="url(#glow)" />
  <path d="M-200,200 Q400,500 800,200 T1800,400 L1800,0 L-200,0 Z" fill="url(#aurora2)" filter="url(#glow)" />

  <!-- Background Mountains / Glaciers -->
  <path d="M-100,700 L200,350 L500,650 L800,250 L1100,600 L1400,300 L1700,700 Z" fill="#0EA5E9" opacity="0.2" />
  <path d="M-50,750 L250,450 L550,700 L850,350 L1150,650 L1450,400 L1750,750 Z" fill="#0284C7" opacity="0.3" />

  <!-- Dynamic Ice Foreground -->
  <path d="M-100,880 L-100,650 C200,650 400,750 800,750 C1200,750 1400,600 1700,600 L1700,880 Z" fill="url(#ice)" />
  <!-- Ice Edge / Depth -->
  <path d="M-100,650 C200,650 400,750 800,750 C1200,750 1400,600 1700,600 L1700,650 C1400,650 1200,800 800,800 C400,800 200,700 -100,700 Z" fill="url(#iceDark)" opacity="0.6"/>

  <!-- Puffins Placed around the scene -->
  
  <!-- Group on the left -->
  <use href="#puffin" x="300" y="700" transform="scale(1.5) translate(-100, -230)" />
  <use href="#puffin" x="420" y="730" transform="scale(1.2) translate(-70, -120)" />
  <use href="#puffin" x="220" y="750" transform="scale(1.3) translate(-40, -170)" />

  <!-- A Puffin sliding on its belly -->
  <g transform="translate(800, 730) rotate(20) scale(1.4)">
    <!-- Body -->
    <path d="M-20,0 C-30,10 -20,20 0,20 C20,20 30,10 20,0 C10,-10 -10,-10 -20,0 Z" fill="#0F172A" />
    <!-- Belly -->
    <path d="M-15,5 C-20,15 20,15 15,5 Z" fill="#FFFFFF" />
    <!-- Head -->
    <circle cx="15" cy="-5" r="12" fill="#0F172A" />
    <!-- Face -->
    <path d="M10,-12 C15,-15 22,-12 25,-5 C25,0 15,2 10,-2 Z" fill="#FFFFFF" />
    <!-- Beak -->
    <path d="M23,-8 L30,-6 L26,2 L20,-2 Z" fill="url(#beakBase)" />
    <path d="M30,-6 C35,-6 40,-2 40,0 C35,0 32,2 28,2 Z" fill="url(#beakTip)" />
    <path d="M28,-7 L32,-3 L28,2 L24,0 Z" fill="#FDE047" />
    <!-- Eye -->
    <path d="M16,-8 C18,-10 20,-10 22,-8 L19,-5 Z" fill="#0F172A" />
    <!-- Sliding motion lines -->
    <path d="M-30,15 L-60,10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M-25,20 L-50,18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Trailing feet -->
    <path d="M-20,-5 L-30,-10 L-25,-2 Z" fill="#F97316" />
  </g>

  <!-- Group on the right -->
  <use href="#puffin" x="1300" y="650" transform="scale(1.4) translate(-370, -180)" />
  <use href="#puffin" x="1450" y="680" transform="scale(1.6) translate(-540, -250)" />
  
  <!-- Flying Puffins -->
  <use href="#puffin-flying" x="1100" y="300" transform="scale(1.5) translate(-360, -100)" />
  <use href="#puffin-flying" x="800" y="200" transform="scale(1.2) translate(-150, -30)" />
  <use href="#puffin-flying" x="1300" y="250" transform="scale(1.8) translate(-570, -110)" />
  <use href="#puffin-flying" x="500" y="350" transform="scale(1.3) translate(110, -80)" />
  
  <!-- Foreground Snow / Sparkles -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="200" cy="800" r="3" />
    <circle cx="500" cy="780" r="4" />
    <circle cx="850" cy="820" r="2" />
    <circle cx="1100" cy="760" r="5" />
    <circle cx="1500" cy="830" r="3" />
    <circle cx="1600" cy="700" r="2" />
    <circle cx="100" cy="680" r="4" />
    <circle cx="1350" cy="790" r="3" />
  </g>
</svg>