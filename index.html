<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puffins Panic!</title>
    <style>
        body {
            background-color: #1a1a24;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            user-select: none;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            margin: 0 0 15px 0;
            text-shadow: 2px 2px 0 #000;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #445;
            border-radius: 4px;
            background: #000;
            max-width: 100vw;
            max-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            cursor: crosshair;
            max-width: 100%;
            height: auto;
        }
        #ui-panel {
            width: 100%;
            max-width: 1600px;
            background: linear-gradient(180deg, #2a2a35 0%, #1e1e28 100%);
            border: 2px solid #445;
            border-top: none;
            border-radius: 0 0 6px 6px;
            display: flex;
            box-sizing: border-box;
            padding: 8px 12px;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        /* Left panel - Stats */
        #stats-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            border: 1px solid #334;
            flex-shrink: 0;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #5f5;
        }
        .stat-divider {
            width: 1px;
            height: 30px;
            background: #445;
        }
        
        /* Center - Skills */
        #skills-panel {
            flex: 1;
            display: flex;
            gap: 4px;
            justify-content: center;
            overflow-x: auto;
        }
        .skill-btn {
            min-width: 55px;
            padding: 4px 6px;
            background: linear-gradient(180deg, #3a3a4a 0%, #2a2a3a 100%);
            border: 1px solid #556;
            border-radius: 4px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            position: relative;
        }
        .skill-btn:hover:not(.empty) {
            background: linear-gradient(180deg, #4a4a5a 0%, #3a3a4a 100%);
            border-color: #778;
            transform: translateY(-1px);
        }
        .skill-btn:active:not(.empty) {
            transform: translateY(0);
            background: linear-gradient(180deg, #2a2a3a 0%, #1a1a2a 100%);
        }
        .skill-btn.selected {
            background: linear-gradient(180deg, #4a6a3a 0%, #3a5a2a 100%);
            border-color: #8f8;
            box-shadow: 0 0 8px rgba(0,255,0,0.3), inset 0 0 8px rgba(0,255,0,0.1);
        }
        .skill-btn.empty {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .skill-icon {
            font-size: 22px;
            line-height: 1;
        }
        .skill-name {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
            color: #aaa;
        }
        .skill-count {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #ff5;
            background: rgba(0,0,0,0.5);
            padding: 0 3px;
            border-radius: 3px;
            line-height: 1.4;
        }
        .skill-btn.selected .skill-count {
            color: #cfc;
        }
        
        /* Right panel - Controls */
        #controls-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            padding: 4px 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            border: 1px solid #334;
            flex-shrink: 0;
        }
        .control-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .control-btn {
            padding: 3px 8px;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            background: linear-gradient(180deg, #3a3a4a 0%, #2a2a3a 100%);
            border: 1px solid #556;
            border-radius: 3px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.1s;
            white-space: nowrap;
        }
        .control-btn:hover {
            background: linear-gradient(180deg, #4a4a5a 0%, #3a3a4a 100%);
            color: #fff;
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        #btn-nuke {
            background: linear-gradient(180deg, #822 0%, #622 100%);
            border-color: #a44;
            color: #faa;
            animation: nuke-pulse 2s infinite;
        }
        #btn-nuke:hover {
            background: linear-gradient(180deg, #a33 0%, #822 100%);
        }
        #btn-nuke.disabled {
            background: #333;
            border-color: #444;
            color: #666;
            animation: none;
            cursor: not-allowed;
        }
        @keyframes nuke-pulse {
            0%, 100% { box-shadow: 0 0 3px rgba(255,0,0,0.2); }
            50% { box-shadow: 0 0 8px rgba(255,0,0,0.5); }
        }
        .rate-control {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
        }
        .rate-control input[type="range"] {
            width: 50px;
            height: 4px;
            accent-color: #5f5;
        }
        
        #message-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            backdrop-filter: blur(2px);
        }
        #message-title {
            font-size: clamp(28px, 6vw, 48px);
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
        }
        #message-desc {
            font-size: clamp(14px, 3vw, 20px);
            margin-bottom: 25px;
            color: #ccc;
        }
        .message-buttons {
            display: flex;
            gap: 10px;
        }
        button.play-btn {
            font-size: clamp(14px, 2vw, 16px);
            padding: clamp(8px, 1.5vw, 10px) clamp(20px, 3vw, 25px);
            font-family: inherit;
            background: linear-gradient(180deg, #4CAF50 0%, #3d8b3d 100%);
            color: white;
            border: 2px solid #6f6;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.15s;
        }
        button.play-btn:hover {
            background: linear-gradient(180deg, #5dbf5d 0%, #4a9e4a 100%);
            transform: translateY(-1px);
        }
        button.play-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1600" height="880"></canvas>
        <div id="message-overlay">
            <div id="message-title">LEVEL COMPLETE!</div>
            <div id="message-desc">You saved enough puffins.</div>
            <div style="display:flex; gap:10px;">
                <button class="play-btn" onclick="retryLevel()">Retry</button>
                <button class="play-btn" id="btn-next" onclick="nextLevel()">Next Level</button>
            </div>
        </div>
        <div id="pause-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); z-index: 20;">
            <div style="font-size: clamp(28px, 6vw, 48px); margin-bottom: 20px; color: #fff; text-shadow: 3px 3px 0 #000;">PAUSED</div>
            <div style="display:flex; gap:10px;">
                <button class="play-btn" onclick="togglePause()">Resume</button>
                <button class="play-btn" onclick="retryLevel()">Restart Level</button>
                <button class="play-btn" onclick="location.reload()">Quit</button>
            </div>
        </div>
        <div id="start-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: url('img/background.jpeg') no-repeat center center; background-size: cover; z-index: 30;">
            
            <div style="display:flex; flex-direction: column; gap: clamp(8px, 1.5vw, 12px); align-items: center;">
                <button class="play-btn" onclick="startGame()" style="font-size: clamp(18px, 3vw, 24px); padding: clamp(10px, 1.5vw, 12px) clamp(40px, 5vw, 60px); min-width: clamp(200px, 30vw, 280px);">▶ Start Game</button>
                <button class="play-btn" onclick="openLevelEditor()" style="font-size: clamp(14px, 2.5vw, 20px); padding: clamp(8px, 1.2vw, 10px) clamp(35px, 4vw, 50px); min-width: clamp(200px, 30vw, 280px); background: linear-gradient(180deg, #2196F3 0%, #1976D2 100%); border-color: #64B5F6;">🛠️ Level Editor</button>
                <button class="play-btn" onclick="Achievements.showPanel()" style="font-size: clamp(13px, 2vw, 18px); padding: clamp(6px, 1vw, 8px) clamp(25px, 3vw, 40px); min-width: clamp(200px, 30vw, 280px); background: linear-gradient(180deg, #FF9800 0%, #F57C00 100%); border-color: #FFB74D;">🏆 Achievements</button>
            </div>
            
            <div style="margin-top: clamp(20px, 3vw, 30px); color: #fff; font-size: clamp(14px, 2vw, 18px); font-weight: bold; text-shadow: 2px 2px 4px #000;">
                <label for="debug-level-select">Quick Start Level: </label>
                <select id="debug-level-select" style="font-size: clamp(14px, 2vw, 18px); font-weight: bold; padding: 5px 10px; font-family: inherit; background: rgba(34,34,34,0.8); color: #fff; border: 2px solid #666;">
                </select>
            </div>
            
            <div style="margin-top: clamp(12px, 2vw, 20px); color: #fff; font-size: clamp(12px, 1.5vw, 16px); font-weight: bold; text-shadow: 2px 2px 4px #000;">
                Arrow Keys: Skills 1-9 | N: Nuke | ESC: Pause
            </div>
            
            <div style="position: absolute; bottom: clamp(10px, 1.5vw, 20px); text-align: center; color: #000; font-size: clamp(11px, 1.5vw, 14px); font-weight: bold; text-shadow: 1px 1px 3px #fff;">
                Created by Christiaan van Hamersveld<br>
                <i>Noscapect Productions</i>
            </div>
        </div>
    </div>
    
    <div id="ui-panel" style="display: none;">
        <!-- Left: Stats -->
        <div id="stats-panel">
            <div class="stat-item">
                <span class="stat-label">Out</span>
                <span class="stat-value" id="lbl-out">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-label">Saved</span>
                <span class="stat-value" id="lbl-in">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-label">Time</span>
                <span class="stat-value" id="lbl-time" style="font-size:14px;">5:00</span>
            </div>
        </div>
        
        <!-- Center: Skills -->
        <div id="skills-panel">
            <!-- Buttons injected by JS -->
        </div>
        
        <!-- Right: Controls -->
        <div id="controls-panel">
            <div class="rate-control">
                <span>Rate:</span>
                <input type="range" id="release-rate" min="1" max="10" value="5" oninput="updateReleaseRate(this.value)">
                <span id="release-rate-val" style="color:#5f5;">5</span>
            </div>
            <div class="control-row">
                <button id="btn-speed" onclick="toggleSpeed()" class="control-btn">⏩ 1x</button>
                <button id="btn-sound" onclick="toggleSound()" class="control-btn">🔊</button>
                <button id="btn-nuke" onclick="triggerNuke()" class="control-btn">💣 NUKE</button>
            </div>
        </div>
    </div>


<script src="js/constants.js"></script>
<script src="js/levels.js"></script>
<script src="js/terrain.js"></script>
<script src="js/particle.js"></script>
<script src="js/sound.js"></script>
<script src="js/achievements.js"></script>
<script src="js/levelEditor.js"></script>
<script src="js/puffin.js"></script>
<script src="js/engine.js"></script>

</body>
</html>
