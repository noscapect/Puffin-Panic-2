<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puffin Panic</title>
    <style>
        body {
            background-color: #1a1a24;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 {
            margin: 0 0 15px 0;
            text-shadow: 2px 2px 0 #000;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #445;
            border-radius: 4px;
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            cursor: crosshair;
        }
        #ui-panel {
            width: 1600px;
            height: 90px;
            background-color: #2a2a35;
            border: 4px solid #445;
            border-top: none;
            border-radius: 0 0 4px 4px;
            display: flex;
            box-sizing: border-box;
            padding: 10px;
            gap: 15px;
        }
        #info-panel {
            flex: 0 0 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #1a1a24;
            border: 2px inset #556;
            padding: 5px 10px;
            font-size: 14px;
            line-height: 1.4;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .release-rate-control {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .release-rate-control input[type="range"] {
            width: 80px;
            accent-color: #5f5;
        }
        #btn-nuke {
            background: #822;
            border: 2px outset #a44;
            color: #faa;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 6px;
            cursor: pointer;
            text-transform: uppercase;
            animation: nuke-pulse 2s infinite;
        }
        #btn-nuke:hover {
            background: #a33;
        }
        #btn-nuke:active {
            border-style: inset;
        }
        #btn-nuke.disabled {
            background: #444;
            border-color: #555;
            color: #777;
            cursor: not-allowed;
            animation: none;
        }
        @keyframes nuke-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.3); }
            50% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.7); }
        }
        .info-val {
            color: #5f5;
            font-weight: bold;
        }
        #skills-panel {
            flex: 1;
            display: flex;
            gap: 8px;
            justify-content: space-around;
        }
        .skill-btn {
            flex: 1;
            background: #334;
            border: 2px outset #667;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.1s;
        }
        .skill-btn:active {
            border-style: inset;
            background: #223;
        }
        .skill-btn.selected {
            background: #4a5a3a;
            border-color: #8f8;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.2);
        }
        .skill-btn.empty {
            color: #777;
            border-color: #444;
            cursor: not-allowed;
        }
        .skill-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        .skill-name {
            font-size: 12px;
            text-transform: uppercase;
        }
        .skill-count {
            font-size: 16px;
            font-weight: bold;
            color: #ff5;
        }
        .skill-btn.selected .skill-count {
            color: #cfc;
        }
        #message-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 880px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }
        #message-title {
            font-size: 48px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
        }
        #message-desc {
            font-size: 24px;
            margin-bottom: 30px;
        }
        button.play-btn {
            font-size: 20px;
            padding: 10px 30px;
            font-family: inherit;
            background: #4CAF50;
            color: white;
            border: 2px solid #fff;
            cursor: pointer;
        }
        button.play-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <h1 id="game-title">Puffin Panic</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="1600" height="880"></canvas>
        <div id="message-overlay">
            <div id="message-title">LEVEL COMPLETE!</div>
            <div id="message-desc">You saved enough puffins.</div>
            <div style="display:flex; gap:10px;">
                <button class="play-btn" onclick="retryLevel()">Retry</button>
                <button class="play-btn" id="btn-next" onclick="nextLevel()">Next Level</button>
            </div>
        </div>
        <div id="pause-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 880px; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); z-index: 20;">
            <div style="font-size: 48px; margin-bottom: 20px; color: #fff; text-shadow: 3px 3px 0 #000;">PAUSED</div>
            <div style="display:flex; gap:10px;">
                <button class="play-btn" onclick="togglePause()">Resume</button>
                <button class="play-btn" onclick="retryLevel()">Restart Level</button>
                <button class="play-btn" onclick="location.reload()">Quit</button>
            </div>
        </div>
        <div id="start-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 880px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); z-index: 30;">
            <div style="font-size: 80px; margin-bottom: 20px; color: #fff; text-shadow: 4px 4px 0 #000;">PUFFIN PANIC</div>
            <div style="font-size: 24px; margin-bottom: 40px; color: #ccc;">Guide the puffins to safety using specialized skills!</div>
            <div style="margin-bottom: 20px; color: #aaa; font-size: 16px;">
                <label for="debug-level-select">Debug - Start Level: </label>
                <select id="debug-level-select" style="font-size: 16px; padding: 5px; font-family: inherit; background: #334; color: #fff; border: 1px solid #556;">
                </select>
            </div>
            <button class="play-btn" onclick="startGame()" style="font-size: 32px; padding: 15px 50px;">Start Game</button>
        </div>
    </div>
    
    <div id="ui-panel">
        <div id="info-panel">
            <div class="info-row"><span>OUT:</span> <span class="info-val" id="lbl-out">0</span></div>
            <div class="info-row"><span>IN:</span> <span class="info-val" id="lbl-in">0%</span></div>
            <div class="info-row"><span>TIME:</span> <span class="info-val" id="lbl-time">5:00</span></div>
            <div class="release-rate-control">
                <span style="font-size:11px;">RATE:</span>
                <input type="range" id="release-rate" min="1" max="10" value="5" oninput="updateReleaseRate(this.value)">
                <span id="release-rate-val" style="font-size:11px; color:#5f5;">5</span>
            </div>
            <button id="btn-speed" onclick="toggleSpeed()" style="margin-top: 5px; font-family: inherit; background: #334; color: #fff; border: 2px outset #667; cursor: pointer; padding: 2px; font-weight: bold; font-size: 12px;" onmousedown="this.style.borderStyle='inset'; this.style.background='#223'" onmouseup="this.style.borderStyle='outset'; this.style.background='#334'" onmouseleave="this.style.borderStyle='outset'; this.style.background='#334'">Speed: 1x</button>
            <button id="btn-nuke" onclick="triggerNuke()" style="margin-top: 5px;">💣 NUKE (N)</button>
        </div>
        <div id="skills-panel">
            <!-- Buttons injected by JS -->
        </div>
    </div>


<script src="js/constants.js"></script>
<script src="js/levels.js"></script>
<script src="js/terrain.js"></script>
<script src="js/particle.js"></script>
<script src="js/puffin.js"></script>
<script src="js/engine.js"></script>

</body>
</html>
